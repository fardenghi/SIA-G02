[project]
name = "autoencoder"
version = "0.1.0"
description = "Autoencoder MLP desde cero (numpy) para el TP5 - aprendizaje de los 32 caracteres de font.h con latente 2D"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
autoencoder = "autoencoder.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoencoder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
