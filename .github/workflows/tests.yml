name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: pytest (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: tp1
            sync: uv sync --dev
          - module: tp2
            sync: uv sync --dev
          - module: tp4
            sync: uv sync
          - module: tp5
            sync: uv sync --extra dev
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: ${{ matrix.sync }}

      - name: Run pytest
        run: uv run pytest -v
